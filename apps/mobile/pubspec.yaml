name: autoroba_mobile
description: AutoRAB X Mobile — EPC Field App (Absensi, Cuti, Reimburse, Tasks)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3

  # Secure storage for JWT
  flutter_secure_storage: ^9.0.0

  # GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Image picker (receipt photos)
  image_picker: ^1.1.2

  # Date formatting
  intl: ^0.19.0

  # State management
  provider: ^6.1.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
