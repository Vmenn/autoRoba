version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoroba_postgres
    environment:
      POSTGRES_USER: autoroba
      POSTGRES_PASSWORD: autoroba_secret
      POSTGRES_DB: autoroba_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoroba"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoroba_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: autoroba_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autoroba_minio
      MINIO_ROOT_PASSWORD: autoroba_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: autoroba_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://autoroba:autoroba_secret@postgres:5432/autoroba_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-use-strong-secret
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: autoroba_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
