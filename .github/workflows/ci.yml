name: CI

on:
  push:
    branches: [main, "claude/**", develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoroba
          POSTGRES_PASSWORD: autoroba_secret
          POSTGRES_DB: autoroba_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://autoroba:autoroba_secret@localhost:5432/autoroba_test

      - name: Run database migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://autoroba:autoroba_secret@localhost:5432/autoroba_test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://autoroba:autoroba_secret@localhost:5432/autoroba_test

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://autoroba:autoroba_secret@localhost:5432/autoroba_test
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test

  build-docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t autoroba-api:ci ./apps/api

      - name: Build Web image
        run: docker build -t autoroba-web:ci ./apps/web
